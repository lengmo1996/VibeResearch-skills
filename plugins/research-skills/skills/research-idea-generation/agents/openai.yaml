interface:
  display_name: "研究创意生成"
  short_description: "生成机制不同、可证伪且资源可行的研究想法组合，并显式标注新颖性风险。"
  default_prompt: "使用 $research-idea-generation，生成机制不同、可证伪且资源可行的研究想法组合，并显式标注新颖性风险。"
dependencies:
  tools:
    - type: "mcp"
      value: "knowledge-hub"
      description: "Read-only search and retrieval from a user-configured KnowledgeHub MCP server"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true