interface:
  display_name: "学术写作"
  short_description: "规划、起草、改写或生成带 hash 前置条件的学术稿件修订。"
  default_prompt: "使用 $writing-academic，规划、起草、改写或生成带 hash 前置条件的学术稿件修订。"
dependencies:
  tools:
    - type: "mcp"
      value: "knowledge-hub"
      description: "Read-only search and retrieval from a user-configured KnowledgeHub MCP server"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true