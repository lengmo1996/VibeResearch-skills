interface:
  display_name: "研究统计功效"
  short_description: "规划样本量、检验效能、MDE 与模拟型 power 分析。"
  default_prompt: "使用 $research-statistical-power，规划样本量、检验效能、MDE 与模拟型 power 分析。"

dependencies:
  tools:
    - type: "mcp"
      value: "knowledge-hub"
      description: "Read-only search and retrieval from a user-configured KnowledgeHub MCP server"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true