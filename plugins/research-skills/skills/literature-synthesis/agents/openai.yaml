interface:
  display_name: "文献综合"
  short_description: "基于可追溯证据比较多篇论文，提炼共识、分歧与研究空白。"
  default_prompt: "使用 $literature-synthesis，基于可追溯证据比较多篇论文，提炼共识、分歧与研究空白。"
dependencies:
  tools:
    - type: "mcp"
      value: "knowledge-hub"
      description: "Read-only search and retrieval from a user-configured KnowledgeHub MCP server"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true