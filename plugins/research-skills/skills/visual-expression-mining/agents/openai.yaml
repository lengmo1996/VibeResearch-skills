interface:
  display_name: "视觉表达模式挖掘"
  short_description: "从研究视觉材料抽取来源可追溯的表达语法、复用边界与下游适配约束。"
  default_prompt: "使用 $visual-expression-mining，从研究视觉材料抽取来源可追溯的表达语法、复用边界与下游适配约束。"
dependencies:
  tools:
    - type: "mcp"
      value: "knowledge-hub"
      description: "Read-only search and retrieval from a user-configured KnowledgeHub MCP server"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true